name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"
      - name: Cache MongoDB Binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-${{ hashFiles('**/package.json') }}
      - name: Install dependencies
        run: pnpm install
      - name: Lint and Format
        run: |
          pnpm run lint
          pnpm run fmt:check
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter client exec playwright install --with-deps chromium
      - name: Install Playwright Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter client exec playwright install-deps chromium
      - name: Run Tests
        run: pnpm run test
        env:
          # Note: mongodb-memory-server usually doesn't need MONGODB_URI
          # as it generates its own, but keeping for your app logic
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          # Force the memory server to use the cached path
          MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries

  deploy:
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
